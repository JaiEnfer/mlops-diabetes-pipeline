stages:
  make_dataset:
    cmd: python src/make_dataset.py
    deps:
      - src/make_dataset.py
    outs:
      - data/raw/diabetes.csv

  prepare:
    cmd: python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw/diabetes.csv
    outs:
      - data/processed/diabetes_processed.csv

  train:
    cmd: python src/train.py
    deps:
      - src/train.py
      - data/processed/diabetes_processed.csv
    params:
      - RIDGE_ALPHA
    outs:
      - models
      - mlruns
